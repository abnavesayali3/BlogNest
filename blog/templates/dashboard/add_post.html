{% extends 'base.html' %}


{% block content %}
<style>
.card {
  transition: 0.2s;
}
.card:hover {
  transform: translateY(-2px);
}
</style>
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
   <div class="col-md-9">

  <div class="card p-4 shadow-sm mx-auto" 
       style="max-width:750px; border-radius:15px; border:1px solid #eee;">

    <!-- Header -->
    <div class="text-center mb-3">
      <h4 style="color:#6f42c1; font-weight:700;">
        <i class="fa fa-pencil"></i> Add New Blog Post
      </h4>
      <p class="text-muted" style="font-size:14px;">
        Create and publish a new article
      </p>
    </div>

    <!-- Form -->
    <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      {{ form|crispy }}

      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-3">

        <!-- Back -->
        <a href="{% url 'posts' %}" 
           class="btn"
           style="border-radius:20px; border:1px solid #6f42c1; color:#6f42c1;">
          ← Back
        </a>

        <!-- Submit -->
        <button type="submit" 
                class="btn"
                style="background:#6f42c1; color:white; border-radius:20px; padding:6px 20px;">
          Publish Post
        </button>

      </div>
    </form>

  </div>

</div>



</div>

{% endblock %}
