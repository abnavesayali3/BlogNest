{% extends 'base.html' %}


{% block content %}

<style>
.card {
  transition: 0.2s;
}
.card:hover {
  transform: translateY(-2px);
}
</style>

{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">

  <div class="card p-4 shadow-sm mx-auto" 
       style="max-width:600px; border-radius:15px; border:1px solid #eee;">

    <!-- Header -->
    <div class="text-center mb-3">
      <h4 style="color:#6f42c1; font-weight:700;">
        <i class="fa fa-plus-circle"></i> Add New Category
      </h4>
      <p class="text-muted" style="font-size:14px;">
        Create and organize your blog categories
      </p>
    </div>

    <!-- Form -->
    <form action="{% url 'add_category' %}" method="POST">
      {% csrf_token %}

      {{ form|crispy }}

      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-3">

        <a href="{% url 'categories' %}" 
           class="btn"
           style="border-radius:20px; border:1px solid #6f42c1; color:#6f42c1;">
          ← Back
        </a>

        <button type="submit" 
                class="btn"
                style="background:#6f42c1; color:white; border-radius:20px; padding:6px 20px;">
          Save Category
        </button>

      </div>
    </form>

  </div>

</div>


</div>

{% endblock %}
