 {% comment %} <div class="col-md-3">
    <div class="nav flex-column nav-pills bg-light" aria-orientation="vertical">
        <a href="{% url 'dashboard' %}" class="nav-link text-dark {% if '/dashboard/' == request.path %}bg-warning{% endif %}">Dashboard</a>
        {% if perms.auth.view_user %}
        <a href="{% url 'users' %}" class="nav-link text-dark {% if '/users/' in request.path %}bg-warning{% endif %}">Users</a>
        {% endif %}
        <a href="{% url 'categories' %}" class="nav-link text-dark {% if '/categories/' in request.path %}bg-warning{% endif %}">Categories</a>
        <a href="{% url 'posts' %}" class="nav-link text-dark {% if '/posts/' in request.path %}bg-warning{% endif %}">Posts</a>
        <a href="" class="nav-link text-dark">Logout</a>
    </div>
</div>   {% endcomment %}

<div class="col-md-3">
  <div class="p-3" style="background:#ffffff; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.05);">

    <h5 style="color:#6f42c1; font-weight:700; margin-bottom:20px;">
      Dashboard
    </h5>

    <div class="nav flex-column">

      <a href="{% url 'dashboard' %}" 
         class="sidebar-link {% if '/dashboard/' == request.path %}active-link{% endif %}">
         <i class="fa fa-home mr-2"></i> Dashboard
      </a>

      {% if perms.auth.view_user %}
      <a href="{% url 'users' %}" 
         class="sidebar-link {% if '/users/' in request.path %}active-link{% endif %}">
         <i class="fa fa-users mr-2"></i> Users
      </a>
      {% endif %}

      <a href="{% url 'categories' %}" 
         class="sidebar-link {% if '/categories/' in request.path %}active-link{% endif %}">
         <i class="fa fa-list mr-2"></i> Categories
      </a>

      <a href="{% url 'posts' %}" 
         class="sidebar-link {% if '/posts/' in request.path %}active-link{% endif %}">
         <i class="fa fa-file-text mr-2"></i> Posts
      </a>

      <a href="{% url 'logout' %}" class="sidebar-link">
         <i class="fa fa-sign-out mr-2"></i> Logout
      </a>

    </div>
  </div>
</div>
